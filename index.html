        // Navigation & UI Controllers (Exposed to Global Scope)
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            const target = document.getElementById('tab-' + tabId);
            if (target) target.classList.remove('hidden');

            document.querySelectorAll('nav a').forEach(el => {

        // Unified Storage Sync (Cloud Firestore + Local Fallback)
        function loadLocalData() {
            try {
                const sTeachers = localStorage.getItem('almajd_teachers');
                const sVisits = localStorage.getItem('almajd_visits');
                const sCriteria = localStorage.getItem('almajd_criteria');
                const sSettings = localStorage.getItem('almajd_settings');
                const sPeriods = localStorage.getItem('almajd_periods');

                if (sTeachers) teachers = JSON.parse(sTeachers);
                if (sVisits) visits = JSON.parse(sVisits);
                if (sCriteria) criteria = JSON.parse(sCriteria);
                if (sSettings) appSettings = JSON.parse(sSettings);
                if (sPeriods) periodTimes = JSON.parse(sPeriods);
            } catch (e) {
                console.warn("Local storage read note:", e);
            }
        }

        async function syncDataWithCloud() {
            loadLocalData();
            if (!window.db) {
                updateSyncBadge(false);
                return;
            }
            try {
                const { collection, getDocs } = window.FirebaseSDK;
                // Fetch Teachers
                const tSnap = await getDocs(collection(window.db, "artifacts", "almajd-visits", "public", "data", "teachers"));
                if (!tSnap.empty) {
                    let cloudTeachers = [];
                    tSnap.forEach(docSnap => cloudTeachers.push(docSnap.data()));
                    if (cloudTeachers.length > 0) {
                        teachers = cloudTeachers;
                    }
                }
                // Fetch Visits
                const vSnap = await getDocs(collection(window.db, "artifacts", "almajd-visits", "public", "data", "visits"));
                if (!vSnap.empty) {
                    let cloudVisits = [];
                    vSnap.forEach(docSnap => cloudVisits.push(docSnap.data()));
                    if (cloudVisits.length > 0) {
                        visits = cloudVisits;
                    }
                }
                // Fetch Settings
                const sSnap = await getDocs(collection(window.db, "artifacts", "almajd-visits", "public", "data", "settings"));
                if (!sSnap.empty) {
                    sSnap.forEach(docSnap => {
                        if (docSnap.id === 'general') appSettings = docSnap.data();
                        if (docSnap.id === 'periods') periodTimes = docSnap.data().periods || periodTimes;
                    });
                }
                saveLocalData();
                updateSyncBadge(true);
                renderTeachers();
                renderVisits();
                renderCriteria();
                renderPeriodSettingsInputs();
                updateBrandingDisplay();
                updateStats();
                renderCharts();
            } catch (err) {
                console.warn("Cloud sync warning (using offline fallback):", err);
                updateSyncBadge(false);
            }
        }

        async function saveCloudData(collectionName, docId, data) {
            saveLocalData();
            if (!window.db) return;
            try {
                const { doc, setDoc } = window.FirebaseSDK;
                await setDoc(doc(window.db, "artifacts", "almajd-visits", "public", "data", collectionName, docId), data);
                updateSyncBadge(true);
            } catch (e) {
                console.warn("Cloud save warning:", e);
                updateSyncBadge(false);
            }
        }

        async function deleteCloudData(collectionName, docId) {
            saveLocalData();
            if (!window.db) return;
            try {
                const { doc, deleteDoc } = window.FirebaseSDK;
                await deleteDoc(doc(window.db, "artifacts", "almajd-visits", "public", "data", collectionName, docId));
            } catch (e) {
                console.warn("Cloud delete warning:", e);
            }
        }

        function updateSyncBadge(isCloud) {
            const badge = document.getElementById('sync-status');
            if (!badge) return;
            if (isCloud) {
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> متصل سحابياً (مزامنة فورية)`;
                badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200";
            } else {
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span> وضع العمل المحلي`;
                badge.className = "inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200";
            }
        }

            appSettings.supervisorName = document.getElementById('setting-supervisor-name').value || appSettings.supervisorName;
            appSettings.ministryLogo = document.getElementById('setting-ministry-logo').value || appSettings.ministryLogo;
            appSettings.schoolLogo = document.getElementById('setting-school-logo').value || appSettings.schoolLogo;
            
            saveLocalData();
            await saveCloudData('settings', 'general', appSettings);
            updateBrandingDisplay();
            alert('تم حفظ الإعدادات سحابياً ومحلياً بنجاح!');
        }
        window.saveGeneralSettings = saveGeneralSettings;

        async function savePeriodSettings() {
            for (let p of periodTimes) {
                const sInp = document.getElementById(`period-start-${p.id}`);
                const eInp = document.getElementById(`period-end-${p.id}`);
                if (sInp && eInp) {
                    p.start = sInp.value;
                    p.end = eInp.value;
                }
            }
            saveLocalData();
            await saveCloudData('settings', 'periods', { periods: periodTimes });
            alert('تم حفظ مواعيد الحصص والفسحة بنجاح!');
        }
        window.savePeriodSettings = savePeriodSettings;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result;
                const el = document.getElementById(inputId);
                if (el) el.value = base64;
                if (inputId === 'setting-ministry-logo') appSettings.ministryLogo = base64;
                if (inputId === 'setting-school-logo') appSettings.schoolLogo = base64;
                saveLocalData();
                await saveCloudData('settings', 'general', appSettings);
                updateBrandingDisplay();
                alert('تم رفع الشعار ومزامنته بنجاح!');

            reader.readAsDataURL(file);

            a.href = url;

        function importBackupJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.teachers) teachers = data.teachers;
                    if (data.visits) visits = data.visits;
                    if (data.criteria) criteria = data.criteria;
                    if (data.appSettings) appSettings = data.appSettings;
                    if (data.periodTimes) periodTimes = data.periodTimes;
                    
                    saveLocalData();
                    for (let t of teachers) await saveCloudData('teachers', t.id, t);
                    for (let v of visits) await saveCloudData('visits', v.id, v);
                    await saveCloudData('settings', 'general', appSettings);

                    renderTeachers();
                    renderVisits();
                    renderCriteria();

                    updateBrandingDisplay();

        // Teacher Management
        function renderTeachers() {
            const tbody = document.getElementById('teachers-table-body');
            if (!tbody) return;

                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">لا يوجد معلمون مسجلون حالياً</td></tr>`;

        function openTeacherModal(id = null) {
            document.getElementById('teacher-id').value = '';
            document.getElementById('teacher-name').value = '';
            document.getElementById('teacher-subject').value = '';
            document.getElementById('teacher-phone').value = '';
            document.getElementById('teacher-modal-title').innerText = 'إضافة معلم جديد';
            
            if (id) {
                const t = teachers.find(x => x.id === id);
                if (t) {
                    document.getElementById('teacher-id').value = t.id;
                    document.getElementById('teacher-name').value = t.name;
                    document.getElementById('teacher-subject').value = t.subject;
                    document.getElementById('teacher-phone').value = t.phone || '';
                    document.getElementById('teacher-modal-title').innerText = 'تعديل بيانات المعلم';
                }
            }
            document.getElementById('teacher-modal').classList.remove('hidden');
        }

            document.getElementById('teacher-modal').classList.add('hidden');
        }
        window.closeTeacherModal = closeTeacherModal;

        function editTeacher(id) { openTeacherModal(id); }
        window.editTeacher = editTeacher;

        async function saveTeacher() {
            const id = document.getElementById('teacher-id').value;
            const name = document.getElementById('teacher-name').value;
            const subject = document.getElementById('teacher-subject').value;
            const phone = document.getElementById('teacher-phone').value;

            if (!name) { alert('يرجى إدخال اسم المعلم'); return; }

            let teacherObj;
            if (id) {
                const idx = teachers.findIndex(x => x.id === id);
                teacherObj = { id, name, subject, phone };
                if (idx !== -1) teachers[idx] = teacherObj;
            } else {
                const newId = 't_' + Date.now();
                teacherObj = { id: newId, name, subject, phone };
                teachers.push(teacherObj);
            }

            saveLocalData();
            await saveCloudData('teachers', teacherObj.id, teacherObj);
            closeTeacherModal();
            renderTeachers();
            updateStats();
            alert('تم حفظ المعلم بنجاح ومزامنته سحابياً!');
        }
        window.saveTeacher = saveTeacher;

        async function deleteTeacher(id) {
            if (confirm('هل أنت متأكد من حذف هذا المعلم؟')) {
                teachers = teachers.filter(x => x.id !== id);
                saveLocalData();
                await deleteCloudData('teachers', id);
                renderTeachers();
                updateStats();
            }
        }
        window.deleteTeacher = deleteTeacher;

        function downloadTeacherExcelTemplate() {

            let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'نموذج_استيراد_المعلمين.csv';
            a.click();
        }
        window.downloadTeacherExcelTemplate = downloadTeacherExcelTemplate;

        function handleTeacherExcelImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const text = e.target.result;
                    const lines = text.split('\n');
                    for (let i = 1; i < lines.length; i++) {
                        const row = lines[i].trim();
                        if (!row) continue;
                        const cols = row.split(',');
                        if (cols.length >= 2) {
                            const name = cols[0].trim();
                            const subject = cols[1].trim();
                            const phone = cols[2] ? cols[2].trim() : '';
                            if (name) {
                                const newT = { id: 't_imp_' + Date.now() + Math.random(), name, subject, phone };
                                teachers.push(newT);
                                await saveCloudData('teachers', newT.id, newT);
                            }
                        }
                    }
                    saveLocalData();
                    renderTeachers();
                    updateStats();
                    alert('تم استيراد ومزامنة المعلمين بنجاح!');
                } catch (err) {
                    alert('خطأ في الاستيراد: ' + err.message);
                }
            };
            reader.readAsText(file);
        }
        window.handleTeacherExcelImport = handleTeacherExcelImport;

        // Teacher Archive Modal
        function openTeacherArchiveModal(teacherId) {
            const t = teachers.find(x => x.id === teacherId);
            if (!t) return;
            const teacherVisits = visits.filter(v => v.teacherId === teacherId);

            document.getElementById('teacher-archive-title').innerText = `أرشيف زيارات المعلم: ${t.name}`;
            document.getElementById('teacher-archive-subtitle').innerText = `المادة: ${t.subject} | الجوال: ${t.phone || '-'}`;
            document.getElementById('teacher-archive-count').innerText = teacherVisits.length;

            let sum = 0;
            teacherVisits.forEach(v => sum += v.totalScore);
            const avg = teacherVisits.length > 0 ? Math.round(sum / teacherVisits.length) : 0;
            document.getElementById('teacher-archive-avg').innerText = avg + '%';

            const tbody = document.getElementById('teacher-archive-table-body');
            tbody.innerHTML = '';
            if (teacherVisits.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">لا توجد زيارات مسجلة لهذا المعلم حتى الآن</td></tr>`;
            } else {
                teacherVisits.forEach(v => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="p-3">${v.date}</td>
                            <td class="p-3">${v.subject}</td>
                            <td class="p-3 text-center"><span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700">${v.totalScore} / 100</span></td>

        function renderCharts() {
            if (typeof Chart === 'undefined') return;

            let domainTotals = {};
            criteria.forEach(c => {
                if (!domainTotals[c.domain]) domainTotals[c.domain] = { earned: 0, max: 0 };
                domainTotals[c.domain].max += c.max;
            });

            visits.forEach(v => {
                if (v.scores) {
                    for (let [cId, score] of Object.entries(v.scores)) {
                        let crit = criteria.find(x => String(x.id) === String(cId));
                        if (crit) {
                            if (!domainTotals[crit.domain]) domainTotals[crit.domain] = { earned: 0, max: 0 };
                            domainTotals[crit.domain].earned += parseFloat(score) || 0;
                        }
                    }
                }
            });

            let domainLabels = [];
            let domainPercentages = [];
            for (let [domain, data] of Object.entries(domainTotals)) {
                domainLabels.push((domain.split(':')[1] || domain).trim());
                domainPercentages.push(data.max > 0 ? Math.round((data.earned / (data.max * (visits.length || 1))) * 100) : 0);
            }

            const chartConfigs = [
                { id: 'domainsChart', instance: domainsChartInstance, setter: (inst) => { domainsChartInstance = inst; } },
                { id: 'homeDomainsChart', instance: homeDomainsChartInstance, setter: (inst) => { homeDomainsChartInstance = inst; } }
            ];

            chartConfigs.forEach(cfg => {
                const el = document.getElementById(cfg.id);
                if (el) {
                    const ctx = el.getContext('2d');
                    if (cfg.instance) cfg.instance.destroy();
                    cfg.setter(new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: domainLabels.length ? domainLabels : ['الاستعداد', 'التدريس', 'الإدارة', 'التوجيهات'],
                            datasets: [{ label: 'نسبة الأداء (%)', data: domainPercentages, backgroundColor: '#10b981', borderRadius: 8 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
                    }));
                }
            });

            let lvlExcellent = 0, lvlVGood = 0, lvlGood = 0, lvlSupport = 0;
            visits.forEach(v => {
                let s = v.totalScore;
                if (s >= 90) lvlExcellent++;
                else if (s >= 80) lvlVGood++;
                else if (s >= 70) lvlGood++;
                else lvlSupport++;
            });

            const doughConfigs = [
                { id: 'levelsChart', instance: levelsChartInstance, setter: (inst) => { levelsChartInstance = inst; } },
                { id: 'homeLevelsChart', instance: homeLevelsChartInstance, setter: (inst) => { homeLevelsChartInstance = inst; } }
            ];

            doughConfigs.forEach(cfg => {
                const el = document.getElementById(cfg.id);
                if (el) {
                    const ctx = el.getContext('2d');
                    if (cfg.instance) cfg.instance.destroy();
                    cfg.setter(new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['متميز (90-100)', 'جيد جداً (80-89)', 'جيد (70-79)', 'يحتاج دعم (<70)'],
                            datasets: [{ data: [lvlExcellent, lvlVGood, lvlGood, lvlSupport], backgroundColor: ['#059669', '#3b82f6', '#f59e0b', '#ef4444'] }]
                        },
                        options: { responsive: true, maintainAspectRatio: false }
                    }));
                }
            });
        }
        window.renderCharts = renderCharts;

        // Live Clock & Period Calculator
        function updateLiveDateTime() {
            const now = new Date();
            
            try {
                const hijriFormatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { day: 'numeric', month: 'long', year: 'numeric' });
                const hijriStr = hijriFormatter.format(now);
                const hEl = document.getElementById('live-hijri-date');
                if (hEl) hEl.innerText = hijriStr;
            } catch (e) {
                const hEl = document.getElementById('live-hijri-date');
                if (hEl) hEl.innerText = "1448 هـ";
            }

            try {
                const gregFormatter = new Intl.DateTimeFormat('ar-SA', { day: 'numeric', month: 'numeric', year: 'numeric' });
                const gEl = document.getElementById('live-gregorian-date');
                if (gEl) gEl.innerText = gregFormatter.format(now) + ' م';
            } catch (e) {
                const gEl = document.getElementById('live-gregorian-date');
                if (gEl) gEl.innerText = now.toLocaleDateString() + ' م';
            }

            const timeStr = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const clockEl = document.getElementById('live-digital-clock');
            if (clockEl) clockEl.innerText = timeStr;

            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            let activeName = "خارج أوقات الدوام";

            for (let p of periodTimes) {
                if (p.start && p.end) {
                    const [sH, sM] = p.start.split(':').map(Number);
                    const [eH, eM] = p.end.split(':').map(Number);
                    const startMin = sH * 60 + sM;
                    const endMin = eH * 60 + eM;
                    if (currentMinutes >= startMin && currentMinutes <= endMin) {
                        activeName = p.name;
                        break;
                    }
                }
            }
            const activePeriodEl = document.getElementById('live-active-period');
            if (activePeriodEl) activePeriodEl.innerText = activeName;
        }
