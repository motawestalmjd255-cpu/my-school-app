<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الزيارات الصفية - متوسطة المجد الجديد الأهلية</title>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- رأس الصفحة -->
    <header class="bg-indigo-900 text-white shadow-lg py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-4 space-x-reverse">
            <img id="headerLogo" src="" alt="شعار المدرسة" class="h-12 w-12 object-contain bg-white rounded-full p-1 shadow">
            <div>
                <h1 id="schoolTitleDisplay" class="text-xl font-bold">متوسطة المجد الجديد الأهلية</h1>
                <p class="text-xs text-indigo-200">منظومة الزيارات الصفية المتقدمة</p>
            </div>
        </div>
        <div class="text-left bg-indigo-800 px-4 py-2 rounded-lg shadow-inner">
            <div id="liveClock" class="text-lg font-mono font-bold tracking-wider">00:00:00</div>
            <div id="currentPeriodDisplay" class="text-xs text-yellow-300 font-semibold">جارِ تحديد الحصة...</div>
        </div>
    </header>

    <!-- التنقل بين التبويبات -->
    <nav class="bg-white shadow border-b px-6 flex space-x-4 space-x-reverse overflow-x-auto">
        <button onclick="switchTab('visits')" class="tab-btn py-3 px-4 font-bold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none transition"><i class="fas fa-clipboard-check ml-2"></i>الزيارات الصفية</button>
        <button onclick="switchTab('teachers')" class="tab-btn py-3 px-4 font-bold text-gray-500 hover:text-indigo-600 focus:outline-none transition"><i class="fas fa-chalkboard-teacher ml-2"></i>دليل المعلمين</button>
        <button onclick="switchTab('settings')" class="tab-btn py-3 px-4 font-bold text-gray-500 hover:text-indigo-600 focus:outline-none transition"><i class="fas fa-cogs ml-2"></i>الإعدادات والبنود</button>
        <button onclick="switchTab('archive')" class="tab-btn py-3 px-4 font-bold text-gray-500 hover:text-indigo-600 focus:outline-none transition"><i class="fas fa-archive ml-2"></i>الأرشيف والتقارير</button>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">
        
        <!-- تبويب الزيارات -->
        <div id="visits" class="tab-content active space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2"><i class="fas fa-edit text-indigo-600 ml-2"></i>تسجيل زيارة صفية جديدة</h2>
                <form id="visitForm" onsubmit="saveVisit(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">المعلم</label>
                        <select id="visitTeacher" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500" required></select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">المادة</label>
                        <input type="text" id="visitSubject" class="w-full border rounded-lg p-2.5" placeholder="أدخل المادة" required>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">الحصة الدراسية</label>
                        <select id="visitPeriod" class="w-full border rounded-lg p-2.5" required>
                            <option value="الحصة الأولى">الحصة الأولى</option>
                            <option value="الحصة الثانية">الحصة الثانية</option>
                            <option value="الحصة الثالثة">الحصة الثالثة</option>
                            <option value="الحصة الرابعة">الحصة الرابعة</option>
                            <option value="الحصة الخامسة">الحصة الخامسة</option>
                            <option value="الحصة السادسة">الحصة السادسة</option>
                        </select>
                    </div>
                    <div class="md:col-span-3">
                        <h3 class="font-bold text-gray-700 mt-4 mb-2">بنود التقييم (الدرجة النهائية: 100)</h3>
                        <div id="criteriaInputsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg border"></div>
                    </div>
                    <div class="md:col-span-3">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">ملاحظات عامة وتوصيات</label>
                        <textarea id="visitNotes" rows="3" class="w-full border rounded-lg p-2.5" placeholder="اكتب الملاحظات والتوصيات هنا..."></textarea>
                    </div>
                    <div class="md:col-span-3">
                        <button type="submit" class="bg-indigo-600 text-white font-bold px-6 py-3 rounded-lg shadow hover:bg-indigo-700 transition w-full"><i class="fas fa-save ml-2"></i>حفظ واعتماد الزيارة</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- تبويب المعلمين -->
        <div id="teachers" class="tab-content space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-md">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-chalkboard-teacher text-indigo-600 ml-2"></i>إدارة المعلمين ودليل التواصل</h2>
                    <button onclick="openAddTeacherModal()" class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-green-700 transition"><i class="fas fa-plus ml-1"></i>إضافة معلم جديد</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-indigo-50 text-indigo-900
